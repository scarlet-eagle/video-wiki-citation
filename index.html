<!DOCTYPE html>
<html>
    <head>
        <title>YouTube Citation Tool</title>
        <style>
            :root {
                color-scheme: light dark;
            }

            textarea {
                width: 100%;
                height: 100px;
                padding: 10px;
                font-size: 14px;
                box-sizing: border-box;
            }
        </style>
    </head>
    <body>
        <h1>YouTube Citation Tool</h1>
        <form id="textForm">
            <fieldset>
                <legend>Select content type:</legend>
                <div>
                    <input type="radio" id="stream" name="type" value="stream" checked />
                    <label for="stream">Stream</label>
                </div>
                <div>
                    <input type="radio" id="video" name="type" value="video" />
                    <label for="video">Video</label>
                </div>
            </fieldset>
            <label for="channel-link">Author page name, e.g. "Rin Penrose" (optional):</label>
            <input type="text" id="channel-link" name="channel-link"/><br/><br/>
            <label for="snippet">Enter a snippet with the metadata from <a href="https://mattw.io/youtube-metadata/">here</a>:</label><br/>
            <textarea id="snippet" placeholder="Copy-paste the snippet here..."></textarea><br/>
            <button type="submit">Submit</button>
        </form>

        <div>
            <h2>Output:</h2>
            <textarea id="output" readonly></textarea>
        </div>

        <script>
            document.getElementById('textForm').addEventListener('submit', function (e) {
                e.preventDefault();

                if (!document.getElementById('snippet').value) return;

                const snippet = JSON.parse(document.getElementById('snippet').value);
                const contentType = document.querySelector('input[name="type"]:checked').value;
                const channelLink = document.querySelector('input[name="channel-link"]').value;
                const contentLink = snippet.thumbnails.default.url.split("/")[4]
                const dateOptions = {
                    day: "numeric",
                    month: "long",
                    year: "numeric",
                }
                const publishedDate = new Date(snippet.publishedAt).toLocaleDateString("en-UK", dateOptions)
                const currentDate = new Date().toLocaleDateString("en-UK", dateOptions)

                const out = `{{Cite ${contentType}${contentType == "stream" ? "\n|where=YouTube" : ""}
|channel-name=${snippet.channelTitle}
|${!channelLink ? "dont-link-channel=yes" : "link=" + channelLink}
|id=${contentLink}
|title=${snippet.title.replaceAll("|", "{{!}}")}
|date=${publishedDate}
|access-date=${currentDate}
}}`

                document.getElementById('output').value = out;
            });
         </script>
    </body>
</html>
